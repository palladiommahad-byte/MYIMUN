name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment scripts
        shell: bash
        run: bash -n deploy/release.sh docker-entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure deployment SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/myimun_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/myimun_deploy ~/.ssh/known_hosts

      - name: Free deployment workspace
        continue-on-error: true
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.name }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            bash -s -- "$IMAGE_REPOSITORY" <<'REMOTE'
          set -Eeuo pipefail
          repository="$1"
          current_container="$(docker container ls -q \
            --filter 'label=com.docker.compose.project=myimun' \
            --filter 'label=com.docker.compose.service=web' | head -n 1)"
          current_image=""

          if [[ -n "$current_container" ]]; then
            current_image="$(docker inspect --format '{{.Config.Image}}' "$current_container")"
          fi

          mapfile -t stopped_containers < <(docker container ls -aq \
            --filter 'label=com.docker.compose.project=myimun' \
            --filter 'status=exited')
          if ((${#stopped_containers[@]} > 0)); then
            docker container rm "${stopped_containers[@]}" >/dev/null
          fi

          while IFS= read -r image; do
            [[ -z "$image" || "$image" == '<none>:<none>' || "$image" == "$current_image" ]] && continue
            docker image rm "$image" >/dev/null 2>&1 || true
          done < <(docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}')
          docker image prune -f >/dev/null

          if [[ -d /opt/myimun/backups ]]; then
            mapfile -t backups < <(
              find /opt/myimun/backups -maxdepth 1 -type f \
                \( -name 'app-*.db' -o -name 'app-*.db.gz' \) \
                -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
            )
            if ((${#backups[@]} > 3)); then
              rm -f -- "${backups[@]:3}"
            fi
          fi

          df -h /
          REMOTE

      - name: Upload deployment configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/myimun/deploy'
          rsync -az \
            -e "ssh -i ~/.ssh/myimun_deploy -p $VPS_PORT" \
            Caddyfile docker-compose.yml deploy/release.sh \
            "$VPS_USER@$VPS_HOST:/opt/myimun/"
          ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'mv /opt/myimun/release.sh /opt/myimun/deploy/release.sh && chmod 750 /opt/myimun/deploy/release.sh'

      - name: Release application
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "cd /opt/myimun && APP_IMAGE='$IMAGE' ./deploy/release.sh"
          ssh -i ~/.ssh/myimun_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            'docker logout ghcr.io >/dev/null 2>&1 || true'

      - name: Verify public HTTPS endpoint
        run: curl --fail --show-error --silent --retry 10 --retry-delay 6 https://moroccanmun.org/api/health
