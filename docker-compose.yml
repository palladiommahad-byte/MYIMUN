# MYIMUN production compose for a Namecheap VPS.
# 1. Point DOMAIN to the VPS IP in Namecheap DNS.
# 2. Copy .env.example to .env and set DOMAIN, ACME_EMAIL, JWT_SECRET, and INITIAL_ADMIN_TOKEN.
# 3. Run: docker compose up -d --build

services:
  web:
    image: "${APP_IMAGE:-myimun:local}"
    build: .
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Absolute path inside the container, unambiguous for both the app and migrations.
      DATABASE_URL: "file:/app/prisma/data/app.db"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in your .env file}"
      INITIAL_ADMIN_TOKEN: "${INITIAL_ADMIN_TOKEN:?Set INITIAL_ADMIN_TOKEN in your .env file}"
      SESSION_DAYS: "${SESSION_DAYS:-7}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Moroccan MUN}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-contact@moroccanmun.org}"
      SMTP_HOST: "${SMTP_HOST:-mail.privateemail.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-contact@moroccanmun.org}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      IMAP_HOST: "${IMAP_HOST:-mail.privateemail.com}"
      IMAP_PORT: "${IMAP_PORT:-993}"
      IMAP_SECURE: "${IMAP_SECURE:-true}"
      IMAP_USER: "${IMAP_USER:-contact@moroccanmun.org}"
      IMAP_PASSWORD: "${IMAP_PASSWORD:-}"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      # The SQLite database + uploaded files survive redeploys here.
      - myimun-data:/app/prisma/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in your .env file}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in your .env file}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 160m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend

volumes:
  myimun-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
